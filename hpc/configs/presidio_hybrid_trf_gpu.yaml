model_name: "presidio_hybrid_trf_gpu"
spacy_model: "en_core_web_trf"
use_gpu: true
paths:
  input: "data/processed/clean_documents.jsonl"
  output_docs: "data/anonymized/presidio_hybrid_trf_gpu_documents.jsonl"
  output_predictions: "outputs/anonymizer_outputs/presidio_hybrid_trf_gpu_predictions.jsonl"

language: "en"

placeholders:
  PERSON: "[PERSON]"
  ORGANIZATION: "[ORG]"
  LOCATION: "[LOCATION]"
  EMAIL: "[EMAIL]"
  PHONE: "[PHONE]"
  DATE: "[DATE]"
  CREDIT_CARD: "[CREDIT_CARD]"
  IBAN: "[IBAN]"

regex_entities:
  - EMAIL
  - PHONE
  - IBAN
  - CREDIT_CARD
  - DATE

ner_entities:
  - PERSON
  - ORGANIZATION
  - LOCATION

precedence:
  first: "regex"
  overlap_policy: "regex_wins"

ner_min_score: 0.50

regex:
  EMAIL:
    enabled: true
    patterns:
      - '\b[A-Za-z0-9](?:[A-Za-z0-9._%+-]*[A-Za-z0-9])?@(?:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}\b'
  PHONE:
    enabled: true
    patterns:
      - '(?<![\w+])(?:\+?\d{1,3}[\s.-]?)?(?:\(?\d{2,4}\)?[\s.-]?)?\d{3,4}[\s.-]?\d{4}(?!\w)'
  IBAN:
    enabled: true
    patterns:
      - '\b[A-Z]{2}\d{2}(?:[ -]?[A-Z0-9]{4}){2,7}[ -]?[A-Z0-9]{1,4}\b'
  CREDIT_CARD:
    enabled: true
    patterns:
      - '(?<!\w)(?:\d{4}[ -]?){3}\d{4}(?!\w)'
      - '(?<!\w)(?:\d[ -]?){13,15}(?!\w)'
  DATE:
    enabled: true
    patterns:
      - '\b\d{4}-\d{1,2}-\d{1,2}\b'
      - '\b\d{1,2}[/.]\d{1,2}[/.]\d{2,4}\b'
      - '\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\s+\d{1,2}(?:,\s*\d{4})?\b'
      - '\b\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*(?:\s+\d{4})?\b'
      - '\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\s+\d{4}\b'

ner:
  PERSON:
    enabled: true
  ORGANIZATION:
    enabled: true
  LOCATION:
    enabled: true
