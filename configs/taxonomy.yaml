taxonomy:
  Governance & Policy:
    Internal Policies:
      description: Bank governance, institutional policy, formal rules, and management frameworks.
      keywords:
        - governance
        - policy
        - internal policy
        - board
        - management framework
        - corporate governance
        - principles
      topics:
        Governance Frameworks:
          description: Board-level governance, control frameworks, corporate governance, and institutional oversight.
          keywords:
            - governance framework
            - corporate governance
            - board oversight
            - internal control
        Regulatory Policy:
          description: Formal regulatory policy, banking standards, policy statements, and supervisory principles.
          keywords:
            - regulatory policy
            - banking policy
            - prudential policy
            - core principles
            - standards
        Contractual Policy:
          description: Formal agreements, contract terms, account terms, and legal policy obligations.
          keywords:
            - agreement
            - contract
            - terms
            - legal opinion
            - account agreement

    Procedures & Guidelines:
      description: Operational procedures, supervisory guidance, manuals, toolkits, and implementation instructions.
      keywords:
        - procedure
        - guideline
        - guidance
        - manual
        - toolkit
        - instructions
        - how to
      topics:
        Supervisory Guidelines:
          description: Supervisory guidance, risk-based guidance, manuals, and external supervisory instructions.
          keywords:
            - supervisory guide
            - guidance
            - guidelines
            - manual
            - risk-based approach
        Operating Procedures:
          description: Step-by-step procedures, operational requirements, authorizations, and processing instructions.
          keywords:
            - operating procedure
            - instructions
            - authorization
            - required fields
            - procedure
        Implementation Toolkits:
          description: Toolkits, templates, glossaries, technical guides, and implementation support material.
          keywords:
            - toolkit
            - template
            - glossary
            - technical guide

  Risk & Compliance:
    AML / KYC:
      description: Anti-money laundering, know-your-customer, financial crime, due diligence, and customer-risk controls.
      keywords:
        - AML
        - KYC
        - anti-money laundering
        - terrorist financing
        - customer due diligence
        - beneficial ownership
        - financial crime
        - FATF
      topics:
        Customer Due Diligence:
          description: Customer identification, due diligence, correspondent banking checks, and KYC review.
          keywords:
            - customer due diligence
            - KYC
            - correspondent banking
            - due diligence
        Beneficial Ownership:
          description: Beneficial ownership transparency, legal arrangements, ownership control, and entity transparency.
          keywords:
            - beneficial ownership
            - legal arrangements
            - ownership control
            - transparency
        Financial Crime Risk Assessment:
          description: Money laundering, terrorist-financing risk assessment, national risk assessment, and AML/CFT monitoring.
          keywords:
            - money laundering
            - terrorist financing
            - national risk assessment
            - AML/CFT
        Virtual Asset Compliance:
          description: Virtual asset and VASP compliance, cryptoasset AML/CFT controls, and implementation monitoring.
          keywords:
            - virtual assets
            - VASP
            - cryptoasset
            - targeted update

    Audit & Monitoring:
      description: Audit, assessment, monitoring, supervisory review, findings, and compliance evaluation.
      keywords:
        - audit
        - monitoring
        - assessment
        - review
        - findings
        - supervision
        - compliance
        - FSAP
      topics:
        Supervisory Review:
          description: Supervisory review, inspection outcomes, SREP, ICAAP review, and thematic findings.
          keywords:
            - supervisory review
            - SREP
            - ICAAP
            - thematic review
            - findings
        Financial Stability Assessment:
          description: Financial-sector assessments, stability reviews, FSAP reports, and macro-financial diagnostics.
          keywords:
            - financial sector assessment
            - FSAP
            - financial stability
            - stability assessment
        Regulatory Monitoring:
          description: Regulatory monitoring, Basel monitoring, implementation checks, and consistency assessments.
          keywords:
            - monitoring report
            - regulatory consistency
            - RCAP
            - Basel III monitoring
        Audit Findings:
          description: Audit findings, external audit work, control weaknesses, and assurance review.
          keywords:
            - audit finding
            - external audit
            - assurance
            - control weakness

    Incident & Fraud:
