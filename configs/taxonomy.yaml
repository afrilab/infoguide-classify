taxonomy:
  Document Type:
    Policy / Procedure / Contract Documents:
      description: Formal, long documents with low but critical PII that often require context-based detection.
      keywords:
        - policy
        - procedure
        - contract
        - agreement
        - terms and conditions
        - compliance policy
        - standard operating procedure
        - operating procedure
        - legal agreement
        - service agreement
        - vendor contract
        - data processing agreement
        - privacy policy
        - governance policy
        - formal document

    Reports (Financial / Incident / Audit):
      description: Semi-formal reports that include dates, organizations, locations, and some hidden PII.
      keywords:
        - report
        - financial report
        - incident report
        - audit report
        - audit finding
        - risk report
        - investigation report
        - assessment report
        - annual report
        - financial statement
        - incident
        - audit
        - findings
        - observations
        - executive summary
        - methodology
        - recommendations

    Internal Communications:
      description: Internal announcements, memos, and meeting notes with mixed structure, mixed tone, and scattered PII.
      keywords:
        - internal communication
        - internal announcement
        - announcement
        - memo
        - memorandum
        - meeting notes
        - meeting minutes
        - internal message
        - staff notice
        - team update
        - internal update
        - agenda
        - action items
        - notes

    Emails:
      description: Noisy real-world email messages with high PII density.
      keywords:
        - email
        - e-mail
        - from:
        - to:
        - cc:
        - bcc:
        - subject:
        - inbox
        - forwarded message
        - original message
        - reply
        - sent
        - message thread
        - email address

    HR Documents / Communications:
      description: HR emails, employee records, and internal HR messages containing critical PII and sensitive data.
      keywords:
        - hr
        - human resources
        - employee record
        - employee records
        - employee
        - personnel file
        - payroll
        - salary
        - benefits
        - performance review
        - performance evaluation
        - leave request
        - onboarding
        - termination
        - recruitment
        - applicant
        - social security
        - employee id

    Forms / Structured Documents:
      description: Structured forms with regex-heavy PII and repeated fields.
      keywords:
        - form
        - structured document
        - application form
        - registration form
        - tax form
        - w-9
        - w-4
        - 1040
        - field:
        - fields:
        - checkbox
        - signature:
        - date of birth
        - ssn
        - taxpayer identification number
        - account number
        - address:
        - phone number
