model_name: "presidio_regex_only"

paths:
  input: "data/processed/clean_documents.jsonl"
  output_docs: "data/anonymized/presidio_regex_only_documents.jsonl"
  output_predictions: "outputs/anonymizer_outputs/presidio_regex_only_predictions.jsonl"

language: "en"
spacy_model: "en_core_web_sm"

placeholders:
  PERSON: "[PERSON]"
  ORGANIZATION: "[ORG]"
  LOCATION: "[LOCATION]"
  EMAIL: "[EMAIL]"
  PHONE: "[PHONE]"
  DATE: "[DATE]"
  CREDIT_CARD: "[CREDIT_CARD]"
  IBAN: "[IBAN]"

# Only regex
regex_entities:
  - EMAIL
  - PHONE
  - IBAN
  - CREDIT_CARD
  - DATE

ner_entities: []

precedence:
  first: "regex"
  overlap_policy: "regex_wins"

ner_min_score: 0.50

regex:
  EMAIL:
    enabled: true
    patterns:
      - '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'

  PHONE:
    enabled: true
    patterns:
      - '(?<!\w)(?:\+?\d{1,3}[\s-]?)?(?:\(?\d{2,4}\)?[\s-]?)?\d{3,4}[\s-]?\d{4}(?!\w)'

  IBAN:
    enabled: true
    patterns:
      - '\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b'
      - '\b[A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){2,7}\s?[A-Z0-9]{1,4}\b'

  CREDIT_CARD:
    enabled: true
    patterns:
      - '\b(?:\d[ -]*?){13,19}\b'

  DATE:
    enabled: true
    patterns:
      - '\b\d{4}-\d{2}-\d{2}\b'
      - '\b\d{1,2}/\d{1,2}/\d{2,4}\b'
      - '\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\s+\d{1,2},\s+\d{4}\b'
      - '\b\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\s+\d{4}\b'

ner: {}