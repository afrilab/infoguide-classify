model_name: "deberta_ner_baseline"
model_id: "RashidNLP/NER-Deberta"

paths:
  input: "data/processed/clean_documents.jsonl"
  output_docs: "data/anonymized/deberta_ner_baseline_documents.jsonl"
  output_predictions: "outputs/anonymizer_outputs/deberta_ner_baseline_predictions.jsonl"

placeholders:
  PERSON: "[PERSON]"
  ORG: "[ORG]"
  ORGANIZATION: "[ORG]"
  LOCATION: "[LOCATION]"
  EMAIL: "[EMAIL]"
  PHONE: "[PHONE]"
  DATE: "[DATE]"
  CREDIT_CARD: "[CREDIT_CARD]"
  IBAN: "[IBAN]"

text_field: "processed_text"

threshold: 0.50
max_chars: 1200
overlap_chars: 150
device: -1
apply_generic_org_filter: true

label_map:
  PERSON:
    - "person"
    - "per"
  ORG:
    - "organisation"
    - "organization"
    - "org"
  LOCATION:
    - "location"
    - "loc"
    - "building"
