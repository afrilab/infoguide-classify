model_name: "gliner_baseline"
model_id: "urchade/gliner_multi-v2.1"

paths:
  input: "data/synthetic/benchmark.json"
  output_docs: "data/anonymized/gliner_baseline_documents.jsonl"
  output_predictions: "outputs/anonymizer_outputs/gliner_baseline_predictions.jsonl"

placeholders:
  PERSON: "[PERSON]"
  ORG: "[ORG]"
  ORGANIZATION: "[ORG]"
  LOCATION: "[LOCATION]"
  EMAIL: "[EMAIL]"
  PHONE: "[PHONE]"
  DATE: "[DATE]"
  CREDIT_CARD: "[CREDIT_CARD]"
  IBAN: "[IBAN]"

# Evaluation is performed only on synthetic benchmark documents.
doc_id_prefixes:
  - "syn_doc"

text_field: "text"

threshold: 0.50
max_chars: 1200
overlap_chars: 150
apply_generic_org_filter: true

labels:
  - label: "person"
    type: "PERSON"
  - label: "organization"
    type: "ORG"
  - label: "location"
    type: "LOCATION"
  - label: "email"
    type: "EMAIL"
  - label: "phone number"
    type: "PHONE"
  - label: "date"
    type: "DATE"
  - label: "credit card number"
    type: "CREDIT_CARD"
  - label: "iban"
    type: "IBAN"
