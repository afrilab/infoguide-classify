# configs/anonymization.yaml

model_name: "regex_spacy_hybrid"

paths:
  input: "data/processed/clean_documents.jsonl"
  output_docs: "data/anonymized/regex_spacy_hybrid_documents.jsonl"
  output_predictions: "outputs/anonymizer_outputs/regex_spacy_hybrid_predictions.jsonl"

language: "en"

# spaCy model used by spaCy NER pipeline
spacy_model: "en_core_web_sm"

# Output placeholders
placeholders:
  PERSON: "[PERSON]"
  ORGANIZATION: "[ORG]"
  LOCATION: "[LOCATION]"
  EMAIL: "[EMAIL]"
  PHONE: "[PHONE]"
  DATE: "[DATE]"
  CREDIT_CARD: "[CREDIT_CARD]"
  IBAN: "[IBAN]"

# Detection Strategy
# Which entity types are handled by regex vs NER
regex_entities:
  - EMAIL
  - PHONE
  - IBAN
  - CREDIT_CARD
  - DATE

ner_entities:
  - PERSON
  - ORGANIZATION
  - LOCATION

# Precedence & Overlap Handling
# Regex spans are frozen and win overlaps with NER spans
precedence:
  first: "regex"
  overlap_policy: "regex_wins"   # options: regex_wins

# Confidence thresholding to apply to NER-based detections
ner_min_score: 0.50

# Regex Patterns
# Enable/disable recognizers and provide patterns.
regex:
  EMAIL:
    enabled: true
    patterns:
      # Standard email with local aliases/subdomains, avoids domains starting or ending with hyphen or dot
      - '\b[A-Za-z0-9](?:[A-Za-z0-9._%+-]*[A-Za-z0-9])?@(?:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}\b'

  PHONE:
    enabled: true
    patterns:
      # Phone number with optional international code, supports +90, 90, spaced, compact, hyphenated, dotted, and parenthesized area codes
      - '(?<![\w+])(?:\+?\d{1,3}[\s.-]?)?(?:\(?\d{2,4}\)?[\s.-]?)?\d{3,4}[\s.-]?\d{4}(?!\w)'

  IBAN:
    enabled: true
    patterns:
      # International IBAN, supports compact, spaced, and hyphenated formats with country code, check digits, and alphanumeric BBAN
      - '\b[A-Z]{2}\d{2}(?:[ -]?[A-Z0-9]{4}){2,7}[ -]?[A-Z0-9]{1,4}\b'

  CREDIT_CARD:
    enabled: true
    patterns:
      # Credit card numbers (grouped format preferred: 4-4-4-4 or similar), reduces false positives
      - '(?<!\w)(?:\d{4}[ -]?){3}\d{4}(?!\w)'
      # Shorter card formats (13–15 digits, e.g., Amex), optional grouping
      - '(?<!\w)(?:\d[ -]?){13,15}(?!\w)'

  DATE:
    enabled: true
    patterns:
      # ISO style date: 2025-12-25
      - '\b\d{4}-\d{1,2}-\d{1,2}\b'
      # Slash or dot style date with full or short year: 25/12/2025, 12/25/2025, 25/12/25, 25.12.2025
      - '\b\d{1,2}[/.]\d{1,2}[/.]\d{2,4}\b'
      # Month name first with optional year: December 25, 2025 or January 12
      - '\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\s+\d{1,2}(?:,\s*\d{4})?\b'
      # Day first with month name and optional year: 25 December 2025 or 12 January
      - '\b\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*(?:\s+\d{4})?\b'
      # Month and year only: June 2025
      - '\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\s+\d{4}\b'

# NER Entity Toggles
ner:
  PERSON:
    enabled: true
  ORGANIZATION:
    enabled: true
  LOCATION:
    enabled: true