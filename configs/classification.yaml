input_path: data/processed/clean_documents.jsonl
output_path: data/classified/classification_results__v1_zeroshot.jsonl
text_fields_priority:
  - processed_text
  - clean_text
  - text

method: zero_shot
model_name: facebook/bart-large-mnli
device: -1

head_only: true
max_chars: 6000

hypothesis_template: "This document is about {}."

multi_label: false
top_k: 4

min_score: 0.10

min_margin: 0.03

use_label_descriptions: true

# ---------------------------------------------------------------------------
# LABELING PROTOCOL
#
# Labels align with document types in the organization.
# Each label describes a document's PRIMARY TYPE and CHARACTERISTICS.
#
# Document Type Classification:
#   1. Policy / Procedure / Contract Documents
#      - Formal, long, low but critical PII, context-based detection
#   2. Reports (Financial / Incident / Audit)
#      - Semi-formal, includes dates, organizations, and locations,
#        contains some hidden PII
#   3. Internal Communications (internal announcements, memos, meeting notes)
#      - Mixed structure, combination of informal and formal tone,
#        scattered PII
#   4. Emails
#      - High PII density, noisy, reflects real-world scenarios
#   5. HR Documents / Communications (HR emails, employee records, internal HR messages)
#      - Critical PII, sensitive data
#   6. Forms / Structured Documents
#      - Regex-heavy PII, structured fields
#

# ---------------------------------------------------------------------------

labels:
  - Policy_Procedure_Contract
  - Reports
  - Internal_Communications
  - Emails
  - HR_Documents
  - Forms_Structured

label_descriptions:
  Policy_Procedure_Contract: >
    Regulatory policy, guidance, or compliance procedure that prescribes rules and obligations for
    financial institutions. Uses prescriptive language: must, shall, should, required, prohibited.
    Includes FATF anti-money laundering guidance, AML/CFT requirements, Basel banking standards,
    risk-based approach guidelines, supervision procedures, enforcement rules, compliance frameworks.
    The document tells institutions what they are required or expected to do.

  Reports: >
    Analytical assessment, research report, or evaluation that presents findings, data, and conclusions
    about a country, sector, or institution. Describes and analyzes what is or was happening rather than
    prescribing rules. Includes World Bank FSAP country assessments, financial sector vulnerability
    assessments, public expenditure reviews, BIS research papers, ECB supervisory reports, monetary
    policy analysis, economic development studies, quarterly banking reviews, country evaluations.
    The document reports on observed conditions, performance, or research results.

  Internal_Communications: >
    Internal organizational memos and announcements for staff communication.
    Includes meeting minutes, internal announcements, team updates, project notes.

  Emails: >
    Email messages and electronic correspondence. Informal communication format.

  HR_Documents: >
    Personnel and employee-related documents. Employee records, human resources,
    recruitment, compensation, employment agreements, performance evaluation.

  Forms_Structured: >
    Structured financial form, legal agreement, certificate, or regulatory filing with defined sections
    and fields. Includes FFIEC bank call report forms (FFIEC 002, FFIEC 031, FFIEC 051), Federal Reserve
    Operating Circular forms and certificates (OC-10), EBA participation agreements, correspondent banking
    agreements, term deposit agreements, authorizing resolutions, letters of agreement, certificates of
    compliance, participant listings, and standardized banking application forms with tables and fields.
