input_path: data/processed/clean_documents.jsonl
output_path: data/classified/classification_results.jsonl
text_fields_priority:
  - processed_text
  - clean_text
  - text

method: zero_shot
model_name: facebook/bart-large-mnli
device: -1

head_only: true
max_chars: 3000

hypothesis_template: "This document is about {}."

multi_label: false
top_k: 4

min_score: 0.35

min_margin: 0.08

use_label_descriptions: true

labels:
  - Policy
  - Compliance
  - Risk
  - Finance

label_descriptions:
  Policy: >
    high-level policy statements, strategic guidance, governance principles,
    policy framework, organizational direction, general policy intent

  Compliance: >
    mandatory legal or regulatory requirements, compliance obligations,
    required controls, enforcement, supervision, audit requirements,
    reporting duties, sanctions, formal compliance procedures

  Risk: >
    risk identification, risk assessment, threat scenarios,
    vulnerabilities, typologies, exposure analysis, risk ratings

  Finance: >
    accounting, budgeting, financial statements, payments,
    banking operations, market activity, financial transactions
